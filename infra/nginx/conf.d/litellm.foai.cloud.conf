# =============================================================================
# litellm.foai.cloud — public face of the central model gateway (Step D)
# =============================================================================
# Hardening discipline against the 2026-03-24 hack vector:
#   - /config/update returns 444 (closed without response) for ALL traffic
#     except an explicit operator-IP allowlist. This blocks the unauth admin
#     endpoint that was used to redirect provider traffic in the original
#     incident.
#   - X-Forwarded-For spoofing is irrelevant here because the geo block
#     reads $remote_addr (peer IP), not headers.
#   - mTLS optional via ssl_verify_client; uncomment when the operator
#     client cert is provisioned.
# =============================================================================

# Allowlist for /config/update — owner workstation IP only.
# Set OPERATOR_IP via the geo block; everyone else lands in $config_update_blocked.
geo $config_update_blocked {
    default 1;
    # 0.0.0.0/0;   # <- DO NOT do this. /config/update must default-deny.
    # Uncomment + set the owner workstation IP after Step D scope approval.
    # 203.0.113.42 0;
}

server {
    listen 80;
    server_name litellm.foai.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name litellm.foai.cloud;

    ssl_certificate /etc/letsencrypt/live/litellm.foai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/litellm.foai.cloud/privkey.pem;

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer";

    # mTLS — uncomment after provisioning operator client cert:
    # ssl_client_certificate /etc/nginx/operator-ca.crt;
    # ssl_verify_client on;

    # ── HARDENED PATHS ─────────────────────────────────────────────────────
    # Block /config/update for everyone NOT in the operator allowlist.
    # 444 = "close connection without response" — better than 403 because
    # it gives no signal that the path even exists.
    location ~ ^/config/update {
        if ($config_update_blocked) {
            return 444;
        }
        proxy_pass http://litellm:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block the admin UI entirely — operations go through compose, not web.
    location ~ ^/(admin|ui) {
        return 444;
    }

    # ── NORMAL PROXY ───────────────────────────────────────────────────────
    location / {
        proxy_pass http://litellm:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming completions need long-lived connections.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
