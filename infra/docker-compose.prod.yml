  # War Room — Boomer_Angs + Chicken Hawk Grading & Content
  war-room:
    build:
      context: ../services/gridiron/war-room
      dockerfile: Dockerfile
    container_name: gridiron-war-room
    expose:
      - "5003"
    environment:
      - PORT=5003
      - NODE_ENV=production
      - CHICKENHAWK_CORE_URL=${CHICKENHAWK_CORE_URL:-http://chickenhawk-core:4001}
      - FILM_ROOM_URL=http://film-room:5002
      - SCOUT_HUB_URL=http://scout-hub:5001
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-pNInz6obpgDQGcFmaJgB}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - perform-debate-logs:/data/debate-logs:ro
      - perform-rankings:/data/rankings
      - perform-content:/data/content
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:5003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aims-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    profiles:
      - perform

  # ---------------------------------------------------------------------------
  # LiteLLM — Central Model Gateway (Wave 1 Step D)
  # ---------------------------------------------------------------------------
  # OpenAI-compatible proxy: every downstream consumer (Hermes Agent, ACHEEVY,
  # AgentScope, ii-agent, AOF children) hits a single URL instead of bespoke
  # per-provider clients. Provider failover + key rotation + cost tracking
  # all centralized here.
  #
  # Pinned to v1.83.7-stable.patch.1 — latest stable + post-2026-03-24-hack
  # patch published 2026-04-23. Note: v1.83.4 referenced in the original
  # plan does not exist as a published tag; corrected after V0 SHA-pin
  # verification per Betty-Anne_Ang's coaching note from Step C.
  # Image SHA: sha256:95d4bd975e39d33c3d5e0add0439d9a9e40f534ec79b2132133e96b3994d3192
  # Hardening discipline shipped with this service:
  #   - Specific patch tag, not :latest or :main (no tag drift)
  #   - master_key in env-only via LITELLM_MASTER_KEY (NEVER in repo)
  #   - enable_jwt_auth: false (the hack vector exploited the JWT path)
  #   - Internal-only on :4000; public route at litellm.foai.cloud is mTLS
  #   - nginx /config/update returns 444 unless source IP is allowlisted
  #     (operator workstation only)
  #   - redact_messages_in_exceptions: true (no prompt PII in error logs)
  #
  # Verification: see infra/litellm-operator.md V0–V7 chain.
  litellm:
    image: ghcr.io/berriai/litellm:v1.83.7-stable.patch.1
    container_name: aims-litellm
    expose:
      - "4000"
    # NO env_file — explicit-only env keeps the secret surface minimum and
    # prevents LiteLLM from inheriting DATABASE_URL pointing at the host
    # Postgres which isn't reachable from the bridge network.
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LOG=INFO
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Disable the internal Prisma DB. Wave 1 runs LiteLLM stateless;
      # state persistence (cost tracking, key partitioning) is Wave 1.5.
      - DISABLE_PRISMA_SCHEMA_UPDATE=true
      - DATABASE_URL=
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    # python3 is the only HTTP-capable tool in the v1.83.7 image (no curl,
    # no wget). Verified by `docker exec aims-litellm which curl python3 wget`.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - aims-network
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

