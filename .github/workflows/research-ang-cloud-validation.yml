{
  "name": "Research Ang isolated build and boot",
  "on": {
    "push": {
      "branches": [
        "build/research-ang-cloud-validation"
      ],
      "paths": [
        ".github/workflows/research-ang-cloud-validation.yml"
      ]
    }
  },
  "permissions": {},
  "env": {
    "SOURCE_SHA": "d57387b5401cbbbbedfd04bc216fa5c5d492842e",
    "DOCKER_BUILDKIT": "1"
  },
  "jobs": {
    "build-and-boot": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {},
      "steps": [
        {
          "name": "Verify pinned public source, build Research Ang, and check offline HTTP routes",
          "shell": "bash",
          "run": "set -euo pipefail\nwork=\"$(mktemp -d)\"\ncontext=\"$work/research-ang\"\nmkdir -p \"$context/src\"\nimage=\"aims-research-ang-validation:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\ncontainer=\"aims-research-ang-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"\ncleanup() {\n  docker logs \"$container\" 2>/dev/null || true\n  docker rm -f \"$container\" >/dev/null 2>&1 || true\n}\ntrap cleanup EXIT\nprintf 'SOURCE_COMMIT=%s\\nWORKFLOW_COMMIT=%s\\nRUN_ID=%s\\n' \"$SOURCE_SHA\" \"$GITHUB_SHA\" \"$GITHUB_RUN_ID\"\nwhile read -r expected file; do\n  curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-redirs 3 --connect-timeout 15 --max-time 60 \\\n    \"https://raw.githubusercontent.com/BoomerAng9/AIMS/$SOURCE_SHA/backend/agents/research-ang/$file\" \\\n    --output \"$context/$file\"\n  actual=\"$(git hash-object \"$context/$file\")\"\n  test \"$actual\" = \"$expected\"\n  printf 'SOURCE_VERIFIED %s %s\\n' \"$actual\" \"$file\"\ndone <<'MANIFEST'\n8714a75127e4164d9a5eb82745ad30fcdc62153a Dockerfile\n343eb96b7a27de98ff0924db8ecfd302f09c9acd package.json\n17bdb188a4d6dad32dacac6c77f774f9f5952d1b package-lock.json\n1236bd703cd53e3d85d02ad0026191f291395745 tsconfig.json\nd271165d8a033db22d781e18e31d354ce716dde7 src/agent-card.ts\n68a44d12c301f4c591f1e2038861e7f1f9dd4c39 src/index.ts\ne28efc836d5bbe21af95d9f7e4c86b5f29d2f595 src/logger.ts\n7002e7522a598da21b824265bd9798b73dc9015b src/research-engine.ts\ndb2a7fb722b43e65bc3fa7bb7b8903687d6ca3a9 src/task-store.ts\nMANIFEST\n\n# Inspect the verified manifest/lock without invoking package scripts.\nCONTEXT=\"$context\" python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\np = Path(os.environ[\"CONTEXT\"])\npackage = json.loads((p / \"package.json\").read_text())\nlock = json.loads((p / \"package-lock.json\").read_text())\nassert package[\"scripts\"][\"build\"] == \"tsc\"\nassert lock[\"lockfileVersion\"] == 3\nassert len(lock[\"packages\"]) == 120\nassert lock[\"packages\"][\"\"][\"dependencies\"] == package[\"dependencies\"]\nassert lock[\"packages\"][\"\"][\"devDependencies\"] == package[\"devDependencies\"]\nassert not any(v.get(\"hasInstallScript\") for v in lock[\"packages\"].values())\nassert all(v[\"resolved\"].startswith(\"https://registry.npmjs.org/\") for v in lock[\"packages\"].values() if \"resolved\" in v)\nprint(\"LOCK_VERIFIED packages=119 install_scripts=disabled audit=disabled fund=disabled\")\nPY\n\n# Resolve the existing official Node 22 Alpine base once; use that digest in both stages.\ndocker pull node:22-alpine\nBASE_REF=\"$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')\"\nexport BASE_REF\ncase \"$BASE_REF\" in node@sha256:*) ;; *) echo \"Unexpected base image identity\"; exit 1;; esac\ndocker run --rm --network none --entrypoint node \"$BASE_REF\" --version\ndocker run --rm --network none --entrypoint npm \"$BASE_REF\" --version\nprintf 'BASE_IMAGE=%s\\n' \"$BASE_REF\"\nCONTEXT=\"$context\" python3 - <<'PY'\nimport os\nfrom pathlib import Path\np = Path(os.environ[\"CONTEXT\"])\ntext = (p / \"Dockerfile\").read_text()\nassert text.count(\"FROM node:22-alpine\") == 2\nassert text.count(\"RUN npm ci --production=false\") == 1\nassert text.count(\"RUN npm run build\") == 1\ntext = text.replace(\"FROM node:22-alpine\", \"FROM \" + os.environ[\"BASE_REF\"])\ntext = text.replace(\"RUN npm ci --production=false\", \"RUN npm ci --include=dev --ignore-scripts --no-audit --no-fund\")\ntext = text.replace(\"RUN npm run build\", \"RUN --network=none npm run build\")\n(p / \"Dockerfile.ci\").write_text(text)\nprint(\"CI_DOCKERFILE_DEVIATIONS: base pinned to resolved digest; install scripts/audit/fund disabled; TypeScript compilation network-disabled\")\nPY\n\ndocker build --pull=false --no-cache --file \"$context/Dockerfile.ci\" --tag \"$image\" \"$context\"\nimage_id=\"$(docker image inspect \"$image\" --format '{{.Id}}')\"\nprintf 'APP_IMAGE=%s\\n' \"$image_id\"\n\n# Real compiled modules must exist. This does not execute application task handlers.\ndocker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \\\n  --entrypoint node \"$image\" -e '\nconst fs = require(\"node:fs\");\nfor (const base of [\"agent-card\",\"index\",\"logger\",\"research-engine\",\"task-store\"]) {\n  for (const ext of [\".js\",\".js.map\",\".d.ts\",\".d.ts.map\"]) {\n    const file = \"/app/dist/\" + base + ext;\n    if (!fs.statSync(file).isFile()) throw new Error(\"Missing compiled artifact: \" + file);\n  }\n}\nconsole.log(\"BUILD_ARTIFACTS_PASS modules=5 files=20\");\n'\n\n# No host ports, volumes, Docker socket, secrets, or external network.\ndocker run --detach --name \"$container\" --network none --read-only --cap-drop ALL \\\n  --security-opt no-new-privileges --memory 256m --cpus 1 \\\n  --env NODE_ENV=production --env UEF_GATEWAY_URL=http://127.0.0.1:9 \"$image\" >/dev/null\n\ntimeout 45s docker exec -i \"$container\" node <<'NODE'\nconst assert = require(\"node:assert/strict\");\nconst sleep = ms => new Promise(resolve => setTimeout(resolve, ms));\nasync function read(path) {\n  const response = await fetch(\"http://127.0.0.1:3020\" + path, {signal: AbortSignal.timeout(1000)});\n  assert.equal(response.status, 200);\n  return response.json();\n}\n(async () => {\n  let health;\n  for (let i = 0; i < 30; i++) {\n    try { health = await read(\"/health\"); break; }\n    catch (error) { if (i === 29) throw error; await sleep(500); }\n  }\n  assert.equal(health.status, \"healthy\");\n  assert.equal(health.agent, \"research-ang\");\n  assert.equal(health.version, \"1.0.0\");\n  assert.equal(health.tasksProcessed, 0);\n  const card = await read(\"/.well-known/agent.json\");\n  assert.equal(card.id, \"research-ang\");\n  assert.equal(card.protocolVersion, \"1.0\");\n  assert.equal(card.capabilities.length, 5);\n  const tasks = await read(\"/a2a/tasks\");\n  assert.equal(tasks.count, 0);\n  assert.deepEqual(tasks.tasks, []);\n  console.log(\"APP_BOOT_PASS health=healthy agent=research-ang capabilities=5 tasks=0\");\n})().catch(error => { console.error(error); process.exitCode = 1; });\nNODE\nprintf 'REAL_APP_BUILD_BOOT_PASS source=%s image=%s run_id=%s finished_utc=%s\\n' \"$SOURCE_SHA\" \"$image_id\" \"$GITHUB_RUN_ID\" \"$(date -u +%FT%TZ)\"\n"
        }
      ]
    }
  }
}
